[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-discovery-engine"
version = "1.0.0"
description = "A modular image retrieval and visual discovery application."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Visual Discovery Engine contributors"}]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "opencv-python-headless>=4.9",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "streamlit>=1.33",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
clip = ["transformers>=4.40", "safetensors>=0.4"]
faiss = ["faiss-cpu>=1.8"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27"]
all = [
  "transformers>=4.40", "safetensors>=0.4", "faiss-cpu>=1.8",
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9",
  "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27"
]

[project.scripts]
visual-search = "visual_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
